# IFA — development / demo compose. PostgreSQL is the canonical database.
#
#   docker compose up --build        → Postgres + app (auto-migrated & seeded) on :3000
#   docker compose up -d postgres    → just Postgres, for `npm run dev` against it
#
# For a zero-setup local run without Docker, set DATABASE_URL=pglite://./.pgdata
# (in-process Postgres) and run `npm run db:setup && npm run dev`.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ifa
      POSTGRES_PASSWORD: ifa
      POSTGRES_DB: ifa
    ports:
      - "5432:5432"
    volumes:
      - ifa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifa -d ifa"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ifa:ifa@postgres:5432/ifa
      IFA_DEMO_MODE: "true"
      AI_PROVIDER: mock
      EMBEDDINGS_PROVIDER: mock
      LOG_LEVEL: info
    restart: unless-stopped

volumes:
  ifa_pg:
